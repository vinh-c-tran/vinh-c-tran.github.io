<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Thin-film growth between hBN layers</title>
  <desc id="desc">Conceptual cross-section of a thin film between two hBN layers. Not to scale.</desc>
  <rect width="360" height="260" fill="#e5ebdf"/>
  <rect x="65" y="47" width="230" height="60" rx="2" fill="#173f35"/>
  <rect x="65" y="117" width="230" height="26" fill="#8caa58"/>
  <rect x="65" y="153" width="230" height="60" rx="2" fill="#173f35"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <text x="180" y="86" font-size="26" fill="#f4f6f2">hBN</text>
    <text x="180" y="136" font-size="17" fill="#173f35">Thin film</text>
    <text x="180" y="192" font-size="26" fill="#f4f6f2">hBN</text>
  </g>
</svg>
